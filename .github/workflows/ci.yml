name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore CD.GenericRepository.sln

      - name: Build
        run: dotnet build CD.GenericRepository.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CD.GenericRepository.sln --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage"

      - name: Pack
        run: dotnet pack CD.GenericRepository.sln --configuration Release --no-build --no-restore --output artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
