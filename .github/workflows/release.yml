name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read
  id-token: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Read package version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore CD.GenericRepository.sln

      - name: Build
        run: dotnet build CD.GenericRepository.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Test
        run: dotnet test CD.GenericRepository.sln --configuration Release --no-build --no-restore -p:Version=${{ steps.version.outputs.value }}

      - name: Pack
        run: dotnet pack CD.GenericRepository.sln --configuration Release --no-build --no-restore --output artifacts/packages -p:PackageVersion=${{ steps.version.outputs.value }}

      - name: Sign in to NuGet with a short-lived credential
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish CD.Results
        run: dotnet nuget push "artifacts/packages/CD.Results.${{ steps.version.outputs.value }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish CD.Results.AspNetCore
        run: dotnet nuget push "artifacts/packages/CD.Results.AspNetCore.${{ steps.version.outputs.value }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish CD.GenericRepository
        run: dotnet nuget push "artifacts/packages/CD.GenericRepository.${{ steps.version.outputs.value }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish compatibility package
        run: dotnet nuget push "artifacts/packages/CD.Generic.Repository.${{ steps.version.outputs.value }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
